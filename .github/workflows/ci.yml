name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    name: ${{ matrix.name || format('Lint and test (Python {0})', matrix.python-version) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
            name: Lint and test (Windows, Python 3.12)

    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run Ruff
        run: uv run ruff check src tests

      - name: Run pytest
        run: uv run pytest -q -ra

      - name: Build package
        run: uv build

      - name: Verify release artifacts
        run: python scripts/verify_release_artifacts.py dist
